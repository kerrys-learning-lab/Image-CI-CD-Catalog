# ============================================================================
include:
  - local: .build.gitlab-ci.yml


# ============================================================================
# Unit tests this image
.image-unit-test:
  extends: .image-build
  stage: test
  variables:
    IMAGE_TARGET: unittest
    IMAGE_BUILD_PUSH_INTERIM: false
    IMAGE_BUILD_CACHE_MODE: none
    CONTAINER_RESULTS_PATH: /var/tmp/test-results.xml # Location *within the
                                                      # container* where xunit
                                                      # report will be written
  before_script:
    - !reference [.image-build,       before_script]
    - !reference [.image-build,       script]
    - |
      # --- image unit-test (before) -----------------------------------------
      mkdir -p ${JOB_ARTIFACTS_DIR}

      podman secret rm --all
      podman secret create --env=true GITLAB_CICD_BOT_TOKEN   GITLAB_CICD_BOT_TOKEN
      podman secret create            glab-config-file        ${GLAB_CONFIG_FILE}
      podman secret create            netrc                   ${NETRC}

      IMAGE_RUN_CLI_ARGS=()
      IMAGE_RUN_CLI_ARGS+=(--rm)
      IMAGE_RUN_CLI_ARGS+=(--tty)
      IMAGE_RUN_CLI_ARGS+=(--secret glab-config-file,type=mount,target=/root/config/glab/config.yml,mode=0666)
      IMAGE_RUN_CLI_ARGS+=(--secret netrc,type=mount,target=/root/.netrc)
      IMAGE_RUN_CLI_ARGS+=(--secret GITLAB_CICD_BOT_TOKEN,type=env)
      IMAGE_RUN_CLI_ARGS+=(--volume ${JOB_ARTIFACTS_DIR}:$(dirname ${CONTAINER_RESULTS_PATH}))

      IMAGE_RUN_URI=${IMAGE_URI}:${IMAGE_INTERIM_TAG}
  script:
    - |
      # --- image unit-test --------------------------------------------------
      echo "📋 Unit testing ${IMAGE_URI}:${IMAGE_INTERIM_TAG}"
      podman run "${IMAGE_RUN_CLI_ARGS[@]}" ${IMAGE_RUN_URI}
  artifacts:
    paths:
      - ${JOB_ARTIFACTS_DIR}
    reports:
      junit: ${JOB_ARTIFACTS_DIR}/**.xml
    when: always
    expire_in: 1 week
